<title>Relatórios mudaram de endereço</title>
<script>
  // Dentro do app do Arcano (janela de app instalado), volta para o Arcano.
  // No navegador comum, leva para o novo endereço dos relatórios.
  var app = window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: minimal-ui)').matches);
  location.replace(app ? '/' : 'https://grupomaster-relatorios.github.io/' + location.hash);
</script>

</head>
